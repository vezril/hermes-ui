apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes.fullname" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hermes
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            # Browser client selector (non-secret, same-origin BFF path). NOTE:
            # the effective BROWSER value is baked into the image at build time
            # (NEXT_PUBLIC_* is inlined by Next.js); this runtime env only governs
            # the server tier's copy. Keep it in sync with the image.
            - name: NEXT_PUBLIC_HERMES_API_BASE
              value: {{ .Values.hermes.apiBase | quote }}
            # Server-side HermesMQ REST connection (BFF only).
            - name: HERMES_ENDPOINT
              value: {{ .Values.hermes.endpoint | quote }}
            {{- if .Values.hermes.token.secretName }}
            # Bearer token from a Secret — never plaintext, never NEXT_PUBLIC_.
            - name: HERMES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hermes.token.secretName }}
                  key: {{ .Values.hermes.token.secretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              # "/" is served independently of HermesMQ, so readiness reflects the
              # console process, not the broker's reachability.
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
