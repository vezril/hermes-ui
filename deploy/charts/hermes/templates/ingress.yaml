{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hermes.fullname" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  {{- if .Values.ingress.clusterIssuer }}
  annotations:
    # cert-manager issues + renews the TLS cert into .spec.tls[].secretName.
    # Only emitted when a clusterIssuer is set (the cluster has none today).
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  # Emitted ONLY when set. An empty value used to render `ingressClassName:`
  # with nothing after it, and a null class is not the same as no class: k3s's
  # bundled Traefik v2.4 silently ignores an Ingress whose class it cannot
  # resolve, so the route 404s while the Ingress object looks perfectly healthy.
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hermes.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
